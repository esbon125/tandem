<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mpeg2fpga demo</title>
</head>
<body>
<h1>mpeg2fpga - PolarFire SoC</h1>
<p>
  <input type="file" id="streamFile" accept=".m2v,.mpg,.mpeg">
  <button id="uploadBtn">Upload</button>
  <span id="status"></span>
</p>
<canvas id="screen" width="320" height="240" style="border:1px solid #444; image-rendering: pixelated;"></canvas>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

document.getElementById("uploadBtn").onclick = async () => {
  const file = document.getElementById("streamFile").files[0];
  if (!file) {
    statusEl.textContent = "select a file first";
    return;
  }
  statusEl.textContent = "uploading...";
  const buf = await file.arrayBuffer();
  const resp = await fetch("/upload", { method: "POST", body: buf });
  const json = await resp.json();
  statusEl.textContent = `uploaded ${json.bytes} bytes`;
};

function connectWS() {
  const ws = new WebSocket(`ws://${location.hostname}:8081/`);
  ws.binaryType = "arraybuffer";

  ws.onmessage = (ev) => {
    const buf = ev.data;
    const view = new DataView(buf);
    const width = view.getUint32(0, true);
    const height = view.getUint32(4, true);
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    const rgba = new Uint8ClampedArray(buf, 8);
    const imageData = new ImageData(rgba, width, height);
    ctx.putImageData(imageData, 0, 0);
  };

  ws.onclose = () => {
    statusEl.textContent = "disconnected, retrying...";
    setTimeout(connectWS, 1000);
  };
  ws.onerror = () => ws.close();
}

connectWS();
</script>
</body>
</html>
